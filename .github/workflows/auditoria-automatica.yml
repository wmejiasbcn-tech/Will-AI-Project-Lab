name: Auditoría Automática y Notificaciones de Errores

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *'    # Cada día a las 8:00 (hora UTC) → 10:00 en Barcelona
  workflow_dispatch:       # Para poder ejecutarla manualmente

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Usamos el PowerShell nativo del sistema directamente, sin intermediarios rotos
      - name: Ejecutar Auditoría Completa
        id: audit
        shell: pwsh
        run: |
          Write-Host "🚀 Iniciando Auditoría Automática del Ecosistema..." -ForegroundColor Cyan
          
          # Verificar que existen las carpetas críticas
          $requiredFolders = @("00_SISTEMA", "03_PERSONAS_IA", "05_VORTICE")
          foreach ($folder in $requiredFolders) {
            if (-not (Test-Path $folder)) {
              Write-Error "❌ Carpeta obligatoria no encontrada: $folder"
              exit 1
            }
          }
          # Verificar archivo de métricas
          if (-not (Test-Path "00_SISTEMA\AUDITORIA_ERRORES_RECURRENTES_Y_METRICAS.md")) {
            Write-Error "❌ Falta el archivo de métricas de confianza"
            exit 1
          }
          Write-Host "✅ Auditoría estructural completada sin errores críticos" -ForegroundColor Green

      - name: Notificar Error (si falla)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const commitTimestamp = github.context.payload.head_commit?.timestamp || new Date().toISOString();
            const fechaError = commitTimestamp;
            const title = '🚨 Error en Auditoría Automática';
            const errorMsg = `🚨 **Auditoría Automática Fallida** Fecha: ${fechaError}  
            Evento: ${{ github.event_name }}  
            Commit: ${{ github.sha }}  
            Error detectado en la auditoría del ecosistema.  
            Revisa los logs arriba.`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auditoria,error'
            });

            const duplicate = existingIssues.data.find(issue => issue.title === title);
            if (duplicate) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `${errorMsg}\n\n*Este problema ya estaba abierto.*`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: errorMsg,
                labels: ['auditoria', 'error']
              });
            }
