name: WAIPL-BUS portero

# BORRADOR (rama hark/borrador-portero-bus). No está activo: GitHub solo ejecuta los
# disparadores de issues y schedule desde la rama principal (main). Nada corre hasta que William fusione.
#
# Portero del bus según SPEC-WAIPL-BUS-v0.1 §9, sin Hermes ni túnel:
# DENY por defecto, permisos por pares (permits.json), identidad por cuenta (nodes.json),
# sello secreto por nodo (HMAC), libro en el Issue, aviso al soberano, límite de 30/h, interruptor BUS_KILL y barrido cada 15 min.
# Si existe HERMES_WEBHOOK_URL, también avisa a Hermes (comportamiento heredado).

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: waipl-bus-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  portero:
    runs-on: ubuntu-latest
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(join(github.event.issue.labels.*.name, ','), 'bus') ||
        startsWith(github.event.issue.title, '[BUS]')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/waipl-bus
          persist-credentials: false
      - name: Portero
        uses: actions/github-script@v7
        env:
          BUS_KILL: ${{ vars.BUS_KILL }}
          BUS_STALL_HOURS: ${{ vars.BUS_STALL_HOURS }}
          # Sello de cada nodo (secretos del repo). Un nodo sin secreto no puede hablar a través de la cuenta del soberano.
          BUS_SEAL_ADA: ${{ secrets.BUS_SEAL_ADA }}
          BUS_SEAL_AETHER: ${{ secrets.BUS_SEAL_AETHER }}
          BUS_SEAL_ARIADNA: ${{ secrets.BUS_SEAL_ARIADNA }}
          BUS_SEAL_CARLA: ${{ secrets.BUS_SEAL_CARLA }}
          BUS_SEAL_HERMES: ${{ secrets.BUS_SEAL_HERMES }}
          BUS_SEAL_SENTINEL: ${{ secrets.BUS_SEAL_SENTINEL }}
          BUS_SEAL_HARK: ${{ secrets.BUS_SEAL_HARK }}
          BUS_SEAL_ZARA: ${{ secrets.BUS_SEAL_ZARA }}
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        with:
          script: |
            const dir = process.env.GITHUB_WORKSPACE + '/.github/waipl-bus/';
            const portero = require(dir + 'portero.js');
            const config = {
              nodes: Object.fromEntries(Object.entries(require(dir + 'nodes.json')).filter(([k]) => !k.startsWith('_')).map(([k, v]) => [k.toLowerCase(), v])),
              permits: require(dir + 'permits.json').permits,
              apps: Object.fromEntries(Object.entries(require(dir + 'apps.json')).filter(([k]) => !k.startsWith('_')).map(([k, v]) => [k.toLowerCase(), v])),
              seals: Object.fromEntries(Object.entries(process.env).filter(([k, v]) => k.startsWith('BUS_SEAL_') && v && v.length >= 32).map(([k, v]) => [k.slice(9).toLowerCase(), v])),
            };
            const killed = String(process.env.BUS_KILL || '').toLowerCase() === 'true';
            const stallHours = Number(process.env.BUS_STALL_HOURS || 24);
            const repo = context.repo;
            const common = { github, repo, config, killed, runId: context.runId, env: process.env };

            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              const r = await portero.sweep({ ...common, stallHours });
              core.info('Barrido: ' + JSON.stringify(r));
              return;
            }

            // El evento trae las etiquetas de entrada; si falta "bus" pero el título es [BUS], se procesa igual.
            const issue = context.payload.issue;
            if (context.eventName === 'issue_comment') {
              if (killed) { core.info('Bus apagado: comentario no procesado.'); return; }
              const r = await portero.processComment({ github, repo, issue, comment: context.payload.comment, config });
              core.info('Comentario: ' + JSON.stringify(r));
              return;
            }
            const r = await portero.processIssue({ ...common, issue });
            core.info('Issue #' + issue.number + ': ' + JSON.stringify(r.skipped ? r : r.decision.verdict));
