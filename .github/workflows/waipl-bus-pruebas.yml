name: WAIPL-BUS pruebas del portero

# Solo ejecuta las pruebas (GitHub falso en memoria). No toca Issues ni etiquetas.
on:
  pull_request:
    paths:
      - ".github/waipl-bus/**"
      - ".github/workflows/waipl-bus*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/waipl-bus/test/portero.test.js
