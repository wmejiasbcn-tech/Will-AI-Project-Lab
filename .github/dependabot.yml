version: 2
updates:
  - package-ecosystem: npm
    directory: /positron
    schedule:
      interval: weekly
      day: "tuesday"
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /graph
    schedule:
      interval: weekly
      day: "thursday"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: "saturday"
    open-pull-requests-limit: 5
