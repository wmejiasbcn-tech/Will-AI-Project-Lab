<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRAPHY — Topología declarada</title>
<style>
  :root { --bg:#0C0C12; --gold:#C9A86A; --violet:#9C81BD; --text:#F2EFE9; --muted:#8A8794; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:Georgia, serif; }
  header { padding:28px 32px 8px; }
  h1 { margin:0; font-weight:300; letter-spacing:.14em; color:var(--gold); font-size:22px; }
  p { margin:8px 0 0; font-size:13px; color:var(--muted); max-width:52rem; line-height:1.6; }
  svg { display:block; width:100%; height:auto; }
  .legend { display:flex; gap:18px; flex-wrap:wrap; padding:0 32px 28px; font-size:12px; color:var(--muted); }
  .sw { display:inline-block; width:18px; height:0; border-top:2px solid var(--gold); vertical-align:middle; margin-right:6px; }
  .sw.dash { border-top-style:dashed; border-top-color:var(--violet); }
</style>
</head>
<body>
<header>
  <h1>GRAPHY · estructura declarada</h1>
  <p>Solo las aristas de <code>graphy-data.js</code>. No hay líneas entre presencias. No hay núcleo. El trazo continuo es master; el discontinuo es experimental.</p>
</header>
<svg id="map" viewBox="0 0 1000 720" role="img" aria-label="Topología Graphy">
  <rect width="1000" height="720" fill="#0C0C12"/>
</svg>
<div class="legend">
  <span><i class="sw"></i>master</span>
  <span><i class="sw dash"></i>experimental</span>
</div>
<script src="producto/_ds/will-ai-project-lab-design-system-9c500662-45cf-4681-9a44-ef71bcfd7609/_ds_bundle.js"></script>
<script type="module">
import { nodes, relationships } from './producto/graphy-data.js';

const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const list = nodes();
const rels = relationships();

const pos = {
  waipl: [500, 360],
  william: [500, 140],
  lab: [280, 400],
  graphy: [720, 400],
};
const pres = list.filter((n) => n.level === 'presence');
pres.forEach((n, i) => {
  const a = (-Math.PI / 2) + (i * 2 * Math.PI) / pres.length;
  pos[n.id] = [500 + Math.cos(a) * 280, 360 + Math.sin(a) * 230];
});

function el(name, attrs) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}

for (const r of rels) {
  const a = pos[r.source], b = pos[r.target];
  if (!a || !b) continue;
  const experimental = r.provenance === 'experimental';
  svg.appendChild(el('line', {
    x1: a[0], y1: a[1], x2: b[0], y2: b[1],
    stroke: experimental ? '#9C81BD' : '#C9A86A',
    'stroke-width': experimental ? 1.1 : 1.4,
    'stroke-opacity': experimental ? 0.55 : 0.75,
    'stroke-dasharray': experimental ? '5 5' : 'none',
  }));
}

for (const n of list) {
  const p = pos[n.id];
  if (!p) continue;
  const color = n.accent === 'violet' ? '#9C81BD' : n.accent === 'white' ? '#F2EFE9' : '#C9A86A';
  const r = n.level === 'ecosystem' ? 16 : n.level === 'domain' ? 11 : 8;
  svg.appendChild(el('circle', { cx: p[0], cy: p[1], r: r + 10, fill: color, 'fill-opacity': 0.08 }));
  svg.appendChild(el('circle', { cx: p[0], cy: p[1], r, fill: '#0C0C12', stroke: color, 'stroke-width': 1.6 }));
  const t = el('text', {
    x: p[0], y: p[1] + r + 16,
    fill: '#F2EFE9', 'font-size': n.level === 'presence' ? 11 : 13,
    'text-anchor': 'middle', 'font-family': 'Georgia, serif',
  });
  t.textContent = n.name;
  svg.appendChild(t);
}
</script>
</body>
</html>
